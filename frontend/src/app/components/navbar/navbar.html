<div class="navbar bg-base-100 shadow-sm">
  <div class="flex-1">
    <a class="btn btn-ghost text-xl" routerLink="/">Folope</a>
  </div>
  <div class="flex-1">
    <label class="input" for="pesquisa">
      <lucide-angular name="search" class="h-[1em] opacity-50"></lucide-angular>
      <input
        id="pesquisa"
        type="search"
        class="grow"
        [formControl]="pesquisa"
        placeholder="Pesquisar..."
        aria-label="Pesquisar"
      />
    </label>
  </div>
  <div class="flex flex-1 justify-end-safe">
    <ul class="menu menu-horizontal px-1">
      <li>
        <label class="flex cursor-pointer gap-2" for="trocar-tema">
          <lucide-angular
            name="moon"
            class="h-[1.5em] opacity-70"
          ></lucide-angular>
          <input
            id="trocar-tema"
            type="checkbox"
            value="light"
            class="toggle theme-controller"
            aria-labelledby="label-trocar-tema"
          />
          <span id="label-trocar-tema" class="sr-only">Alternar tema</span>
          <lucide-angular
            name="sun"
            class="h-[1.5em] opacity-70"
          ></lucide-angular>
        </label>
      </li>
      @if(!this.authServ.tokenValido()){
      <li><a (click)="login()">Entrar</a></li>
      <li><a (click)="cadastrar()">Cadastrar</a></li>

      }@else{
      <li>
        <div class="dropdown dropdown-hover dropdown-end">
          Jhonatan
          <div class="btn btn-ghost btn-circle avatar">
            <div class="w-10 rounded-full">
              <img
                alt="Foto de usuário"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVbm0apPzC3cth6gQXKHIo1e5SDb_GUK-mhBN7TbuFRWq6QdITpeOy9z3NMevztUEX10I&usqp=CAU"
              />
            </div>
          </div>
          <ul
            tabindex="-1"
            class="dropdown-content menu bg-base-100 rounded-box z-1 w-52 p-2 shadow-sm"
          >
            <li><a>Perfil</a></li>
            <li><a>Atividades</a></li>
            <li><a>Configurações</a></li>
            <li><a (click)="logout()">Sair</a></li>
          </ul>
        </div>
      </li>
      }
    </ul>
  </div>
</div>
