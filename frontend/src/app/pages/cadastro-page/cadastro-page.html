<div class="hero bg-base-200 min-h-screen">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">Cadastrar</h1>
      <p class="py-6">
        Quem é mais provável de...? ASSISTIR um filme de terror sozinho?
      </p>
    </div>
    <div class="card bg-base-100 w-full max-w-sm shrink-0 shadow-2xl">
      <div class="card-body">
        <form [formGroup]="cadastroForm" (ngSubmit)="cadastrar()">
          <fieldset class="fieldset">
            <label class="label" for="apelidoInput">Nome de usuário</label>
            <input
              id="nomeUsuarioInput"
              [formControl]="obterControleFormulario('nomeUsuario')"
              type="email"
              class="input"
              placeholder="Diga quem é você..."
            />
          </fieldset>
          <fieldset class="fieldset mt-4">
            <label class="label" for="senhaInput"> Senha</label>
            <input
              id="senhaInput"
              [formControl]="obterControleFormulario('senha')"
              type="password"
              class="input"
              placeholder="Digite a senha, se é que você lembra..."
            />
            <div><a class="link link-hover">ixi! Esqueci a senha.</a></div>
            <button class="btn btn-neutral mt-4" type="submit">
              Cadastrar
            </button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>
